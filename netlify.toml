[build]
  publish = "frontend/main-page"
  command = "echo 'No build command needed for static site'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Optional: redirect root to landing
[[redirects]]
  from = "/"
  to = "/landing/"
  status = 200
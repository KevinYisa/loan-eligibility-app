[build]
  publish = "frontend/dist" # Or just "frontend" depending on your Vite output folder
  command = "npm run build" # CRITICAL: This runs your Vite build so environment variables get baked in

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/landing/"
  status = 200
